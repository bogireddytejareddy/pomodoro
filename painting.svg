<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .08" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15"/>
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282a27" stop-opacity=".2"/>
      <stop offset="1" stop-color="#282a27" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#f2eee4"/>
  <rect width="1600" height="1000" fill="#393a34" filter="url(#paper)"/>
  <circle cx="1175" cy="266" r="92" fill="#b74732" opacity=".72" filter="url(#wash)"/>
