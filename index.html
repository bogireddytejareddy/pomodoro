<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2eee4" />
    <meta name="description" content="A minimal Pomodoro timer." />
    <title>Pomodoro</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <img class="painting" src="painting.svg" alt="" aria-hidden="true" />
    <main>
      <header>
        <a class="brand" href="./" aria-label="Pomodoro home"><i></i>pomodoro</a>
        <button class="sound" id="soundButton" type="button" aria-label="Mute sound" aria-pressed="true">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 7 8.5H3v7h4l4 3.5V5Zm4.5 3.2a5.4 5.4 0 0 1 0 7.6M18 5.5a9 9 0 0 1 0 13" /></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 7 8.5H3v7h4l4 3.5V5Zm4 5 5 5m0-5-5 5" /></svg>
        </button>
      </header>
      <section class="timer" aria-label="Pomodoro timer">
        <div class="clock">
          <svg viewBox="0 0 340 340" aria-hidden="true">
            <circle class="track" cx="170" cy="170" r="145" />
            <circle class="progress" id="progressCircle" cx="170" cy="170" r="145" />
          </svg>
          <div class="time-wrap">
            <i class="status-dot"></i>
            <time id="timeDisplay" datetime="PT30M">30:00</time>
          </div>
        </div>
        <div class="presets" role="radiogroup" aria-label="Focus duration">
          <button class="active" type="button" role="radio" aria-checked="true" data-minutes="30">30m</button>
          <button type="button" role="radio" aria-checked="false" data-minutes="60">1h</button>
          <button type="button" role="radio" aria-checked="false" data-minutes="180">3h</button>
        </div>
        <div class="actions">
          <button class="reset" id="resetButton" type="button">reset</button>
          <button class="start" id="startButton" type="button"><span id="startText">start</span></button>
        </div>
        <p class="sr-only" id="timerStatus" aria-live="polite">Timer ready</p>
      </section>
    </main>
  </body>
</html>
